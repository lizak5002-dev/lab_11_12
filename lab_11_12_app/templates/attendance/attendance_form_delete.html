{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3>Удалить запись о посещаемости?</h3>
                <p>Дата: {{ attendance.date }}</p>
                <p>Ребенок: {{ attendance.child }}</p>
                <p>Статус: {{ attendance.get_status_display }}</p>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Удалить</button>
                    <a href="{% url 'attendance_list' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
